<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>YvnBet CMS</title><link rel="stylesheet" href="/assets/css/main.css"></head><body><main class="admin-shell"><section class="admin-card admin-wide"><div class="admin-head"><div><span class="eyebrow">YVNBET CMS</span><h1>Content</h1></div><button class="btn" id="logout">Logout</button></div><div id="status"></div><label>Telegram URL<input id="telegram"></label><label>Login URL<input id="loginUrl"></label><div id="langs"></div><div class="admin-actions"><button class="btn btn-primary" id="save">Publish</button></div></section></main><script>let content;const $=s=>document.querySelector(s);async function load(){const r=await fetch('/api/admin/content');if(!r.ok){location.href='/yvn/admin/login/bet/admin/';return}content=await r.json();$('#telegram').value=content.telegramUrl||'';$('#loginUrl').value=content.loginUrl||'';$('#langs').innerHTML=content.languages.map(l=>'<h3>'+l.toUpperCase()+'</h3>'+Object.entries(content.ui).map(([k,v])=>'<label>'+k+'<input data-k="'+k+'" data-l="'+l+'" value="'+String(v[l]||'').replaceAll('&','&amp;').replaceAll('"','&quot;')+'"></label>').join('')).join('')}$('#save').onclick=async()=>{content.telegramUrl=$('#telegram').value;content.loginUrl=$('#loginUrl').value;document.querySelectorAll('[data-k]').forEach(i=>content.ui[i.dataset.k][i.dataset.l]=i.value);const r=await fetch('/api/admin/content',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(content)});$('#status').textContent=r.ok?'Published':'Publish failed'};$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/yvn/admin/login/bet/admin/'};load();</script></body></html>
