<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>YvnBet Admin</title><link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/admin.css"></head><body><main class="admin-shell"><section class="admin-card"><span class="eyebrow">YVNBET CMS</span><h1>Admin</h1><form id="login"><input name="username" autocomplete="username" placeholder="Username" required><input name="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn btn-primary" type="submit">Sign in</button><p id="error"></p></form></section></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});if(r.ok)location.href='/yvn/admin/login/bet/admin/dashboard.html';else document.querySelector('#error').textContent='Invalid credentials';});</script></body></html>
